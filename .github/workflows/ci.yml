name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: test (macos-latest, node 22)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test --test-concurrency=4
      - name: CLI smoke test
        run: node bin/trellis.mjs --version

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        shell: bash
        # Windows runners are slower and the suites spawn processes; keep the
        # file-level concurrency low to avoid lock/CPU contention flakes.
        run: |
          node --test ${{ matrix.os == 'windows-latest' && '--test-concurrency=1' || '--test-concurrency=4' }} 2>&1 | tee test-output.log
          exit ${PIPESTATUS[0]}
      - name: Surface the failure
        if: failure()
        shell: bash
        run: |
          echo '### Test failure tail' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 test-output.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^not ok|✖' test-output.log | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node scripts/coverage-gate.mjs
      - name: CLI smoke test
        run: node bin/trellis.mjs --version
