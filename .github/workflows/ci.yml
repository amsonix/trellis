name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        # Windows runners are slower and the suites spawn processes; keep the
        # file-level concurrency low to avoid lock/CPU contention flakes.
        run: node --test ${{ matrix.os == 'windows-latest' && '--test-concurrency=2' || '--test-concurrency=4' }}
      - name: Coverage gate
        run: node scripts/coverage-gate.mjs
      - name: CLI smoke test
        run: node bin/trellis.mjs --version
