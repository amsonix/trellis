name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: build and attach the tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test
      - name: Coverage gate
        run: node scripts/coverage-gate.mjs
      - name: Build the tarball
        run: node scripts/release-tarball.mjs
      - name: Create the release when it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
      - name: Upload the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
      - name: Record the checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum dist/*.tgz | awk '{print $1}')
          name=$(basename dist/*.tgz)
          gh release edit "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for the full notes.

          $name sha256: $sha"
